# Scrapes the app on the host (mvn spring-boot:run on port 8080). Short interval so a smoke test shows numbers fast.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fraud-detection
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
