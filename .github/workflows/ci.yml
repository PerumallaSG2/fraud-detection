name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Fail if any test was skipped
        run: |
          if grep -h -o 'skipped="[1-9][0-9]*"' target/surefire-reports/TEST-*.xml; then
            echo "Some tests were skipped. In CI every test must run."
            exit 1
          fi
          echo "No skipped tests."
