spring:
  application:
    name: fraud-detection
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/fraud
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}   # 6380 avoids clashing with a local Redis on 6379
      timeout: 200ms             # fail fast: a slow Redis must not stall scoring
      connect-timeout: 200ms
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false   # keep the request timestamp's own offset (odd hours reads it)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

fraud:
  max-score: 100
  thresholds:
    review: 40              # score < review is APPROVE
    block: 70               # score > block is BLOCK; review..block inclusive is REVIEW
  amount-spike:
    points: 40
    lookback: 20            # last N non-BLOCK transactions form the baseline
    min-history: 5          # below this, fall back to fallback-limit
    multiplier: 3.0         # fires when amount > multiplier x average
    fallback-limit: 5000
  risky-merchant:
    points: 30
    categories: [GAMBLING, CRYPTO, WIRE_TRANSFER]
  odd-hours:
    points: 20
    start-hour: 0           # window is [start-hour, end-hour) in the timestamp's own offset
    end-hour: 5
  velocity:
    points: 30
    max-transactions: 5     # fires when the window holds more than this, counting the current transaction
    window: 60s             # (ts - window, ts], by the transaction's own timestamp

management:
  endpoints:
    web:
      exposure:
        include: health,info
