spring:
  application:
    name: fraud-detection
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/fraud
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}   # 6380 avoids clashing with a local Redis on 6379
      timeout: 200ms             # fail fast: a slow Redis must not stall scoring
      connect-timeout: 200ms
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9094}   # 9094 avoids clashing with a local Kafka on 9092
    producer:
      acks: all                       # with the default idempotent producer: no loss, no reordering on retry
      properties:
        max.block.ms: 2000            # fail fast when the broker is unreachable: POST returns 503, not a hang
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000     # must be >= linger.ms + request.timeout.ms
    consumer:
      auto-offset-reset: earliest     # a new consumer group starts from the beginning, so nothing accepted is skipped
    listener:
      concurrency: 3                  # one thread per partition (fraud.messaging.partitions)
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false   # keep the request timestamp's own offset (odd hours reads it)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

fraud:
  messaging:
    partitions: 3           # per topic; changing it later re-maps cards to partitions (breaks per-card order once)
    send-timeout: 5s        # publish waits this long for the broker's ack
    retry:
      max-attempts: 3       # total, first included; then the record goes to <topic>.DLT
      backoff: 1s           # the record's partition waits too, which keeps each card in order
  explanations:             # REVIEW/BLOCK only, written off the scoring path; falls back to the rule reasons
    ollama:                 # default provider (any profile but "bedrock")
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: llama3.2:1b
      connect-timeout: 500ms  # Ollama not running: refused at once, rule reasons used
      timeout: 5s           # the first call after Ollama starts loads the model and may take longer
      max-tokens: 160
    bedrock:                # profile "bedrock"; any Converse model or inference profile id works
      model-id: ${BEDROCK_MODEL_ID:global.anthropic.claude-haiku-5-5}   # Claude Haiku 5.5, global cross-Region profile
      region: ${AWS_REGION:us-east-1}
      timeout: 10s
      max-tokens: 1024      # reasoning tokens can count toward it; the length cap is the prompt and ExplanationText
  max-score: 100
  thresholds:
    review: 40              # score < review is APPROVE
    block: 70               # score > block is BLOCK; review..block inclusive is REVIEW
  amount-spike:
    points: 40
    lookback: 20            # last N non-BLOCK transactions form the baseline
    min-history: 5          # below this, fall back to fallback-limit
    multiplier: 3.0         # fires when amount > multiplier x average
    fallback-limit: 5000
  risky-merchant:
    points: 30
    categories: [GAMBLING, CRYPTO, WIRE_TRANSFER]
  odd-hours:
    points: 20
    start-hour: 0           # window is [start-hour, end-hour) in the timestamp's own offset
    end-hour: 5
  velocity:
    points: 40              # alone this reaches the review threshold
    max-transactions: 5     # fires when the window holds more than this, counting the current transaction
    window: 60s             # (ts - window, ts], by the transaction's own timestamp
  geo-mismatch:
    points: 40              # alone this reaches the review threshold; with another strong signal, block
    max-speed-kmh: 900      # fires above this speed between this and the previous non-BLOCK transaction
    min-distance-km: 50     # shorter hops never fire (GPS noise, neighbouring towns)

management:
  endpoints:
    web:
      exposure:
        include: health,info
